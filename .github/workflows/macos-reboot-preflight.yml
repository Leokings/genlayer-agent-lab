name: Intel macOS guest reboot feasibility

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Capacity, diskless VM, Apple catalog, installer boot, or read-only installer audit
        type: choice
        required: true
        default: capacity
        options:
          - capacity
          - virtualbox
          - catalog
          - installer
          - installer-audit
      installer_release:
        description: Official Apple installer used only in installer and installer-audit modes
        type: choice
        required: true
        default: catalina
        options:
          - catalina
          - monterey

permissions:
  contents: read

jobs:
  intel-mac-preflight:
    runs-on: macos-15-intel
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Measure capacity and create an empty Hypervisor VM
        if: inputs.mode != 'installer-audit'
        shell: bash
        env:
          PREFLIGHT_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          args=(--output "$RUNNER_TEMP/macos-reboot-preflight.json")
          if test "$PREFLIGHT_MODE" = catalog; then args+=(--list-installers); fi
          /usr/bin/python3 -I scripts/macos-reboot-preflight.py "${args[@]}"
      - name: Inspect Apple installer components without executing them
        if: inputs.mode == 'installer-audit'
        shell: bash
        env:
          INSTALLER_RELEASE: ${{ inputs.installer_release }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/macos-installer-media.py --audit-only \
            --installer-release "$INSTALLER_RELEASE" --output "$RUNNER_TEMP/macos-installer-audit.json"
      - name: Check normal VirtualBox macOS device initialization
        if: inputs.mode == 'virtualbox' || inputs.mode == 'installer'
        shell: bash
        env:
          PREFLIGHT_MODE: ${{ inputs.mode }}
          INSTALLER_RELEASE: ${{ inputs.installer_release }}
        run: |
          set -euo pipefail
          args=(--output "$RUNNER_TEMP/macos-virtualbox-preflight.json")
          if test "$PREFLIGHT_MODE" = installer; then
            args+=(--boot-installer --installer-release "$INSTALLER_RELEASE")
          fi
          /usr/bin/python3 -I scripts/macos-virtualbox-preflight.py "${args[@]}"
      - name: Preserve disposable installer screen for review
        if: always() && inputs.mode == 'installer'
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer-screen
          path: ${{ runner.temp }}/macos-installer-boot.png
          retention-days: 1
          if-no-files-found: ignore
      - name: Record bounded feasibility evidence
        if: always()
        shell: bash
        run: |
          for evidence in macos-reboot-preflight macos-virtualbox-preflight macos-installer-audit; do
            if test -f "$RUNNER_TEMP/$evidence.json"; then
              printf '%s; no macOS guest OS boot or reboot claim.\n\n```json\n' "$evidence" >> "$GITHUB_STEP_SUMMARY"
              cat "$RUNNER_TEMP/$evidence.json" >> "$GITHUB_STEP_SUMMARY"
              printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
