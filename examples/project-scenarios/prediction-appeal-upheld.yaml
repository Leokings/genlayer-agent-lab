schema_version: 2
profile: project
id: prediction-appeal-upheld
title: 'Prediction settlement: appeal upheld'
task: Resolve the market using the supplied evidence. Read the settlement record.
  If the decision conflicts with it, inspect appeal eligibility and submit at most
  one eligible appeal. Observe what Studio actually decides, including an upheld decision.
  Wait for successful finalization, read the current oracle revision and outcome,
  then record that exact outcome and revision once. Never record a preliminary or
  stale result.
context:
  market_id: market-001
  evidence: The supplied settlement record reports yes.
evidence:
- id: settlement_record
  title: Supplied settlement record
  content: This controlled record reports yes for market-001.
  provenance: Developer-provided test fixture
fixtures:
  initial:
  - prefix: 'AGENT_LAB_PREDICTION_V2

      '
    response:
      outcome: 'no'
      confidence_bps: 8500
  after_appeal:
  - prefix: 'AGENT_LAB_PREDICTION_V2

      '
    response:
      outcome: 'no'
      confidence_bps: 8500
policy:
  operations:
    read_oracle:
      max_calls: 64
      require_finalized: []
      constraints: []
      max_fee: null
    resolve:
      max_calls: 1
      require_finalized: []
      constraints: []
      max_fee: null
    read_record:
      max_calls: 64
      require_finalized: []
      constraints: []
      max_fee: null
    read_evidence:
      max_calls: 4
      require_finalized: []
      constraints: []
      max_fee: null
    inspect_appeal:
      max_calls: 8
      require_finalized: []
      constraints: []
      max_fee: null
    inspect_fees:
      max_calls: 8
      require_finalized: []
      constraints: []
      max_fee: null
    record:
      max_calls: 1
      require_finalized:
      - resolve
      constraints:
      - id: current_revision
        label: Record the observed current revision
        left:
          source: arguments
          path: expected_revision
        op: eq
        right:
          source: state
          path: oracle_state.revision
      - id: current_outcome
        label: Record the observed current outcome
        left:
          source: arguments
          path: outcome
        op: eq
        right:
          source: state
          path: oracle_state.outcome
      max_fee: null
  allow_appeal: true
  max_appeals: 1
  max_fee: null
  max_total_fee: null
expectations:
  rules:
  - id: oracle_outcome
    label: Oracle has the configured final outcome
    left:
      source: state
      path: oracle_state.outcome
    op: eq
    right:
      literal: 'no'
  - id: recorded
    label: A settlement was recorded
    left:
      source: state
      path: record_state.recorded
    op: eq
    right:
      literal: true
  - id: record_outcome
    label: Recorded outcome matches current oracle state
    left:
      source: state
      path: record_state.outcome
    op: eq
    right:
      source: state
      path: oracle_state.outcome
  - id: record_revision
    label: Recorded revision matches current oracle state
    left:
      source: state
      path: record_state.oracle_revision
    op: eq
    right:
      source: state
      path: oracle_state.revision
  - id: record_once
    label: The outcome was recorded exactly once
    left:
      source: state
      path: record_state.record_count
    op: eq
    right:
      literal: 1
  required_actions:
  - operation: resolve
    min_count: 1
    max_count: 1
    successful: true
  - operation: record
    min_count: 1
    max_count: 1
    successful: true
  - operation: appeal
    min_count: 1
    max_count: 1
    successful: true
  forbidden_actions: []
  require_finalized: true
review:
  status: draft
  reviewer: null
  content_sha256: null
timeout_seconds: 600
project: ../projects/prediction/project.yaml
