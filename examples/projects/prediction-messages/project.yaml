schema_version: 2
kind: project
id: prediction_messages
title: Prediction record with a downstream audit message
contracts:
  oracle:
    source_project:
      root: oracle
      entrypoint: __init__.py
      files:
      - __init__.py
      - rules.py
      runner: py-genlayer-multi:faykzar6hr5ehfm07jatm69erx6nv96wmz1ab1dszjthbcgre3m0
      dependencies:
      - py-lib-genlayer-std:kzr02ndm9et4qkmbqpq5djjt5sme2yt76n7sz1qbzax0knt6mam0
    constructor_args:
    - type:
        type: string
        max_length: 128
      value:
        literal: market-001
  recorder:
    source_project:
      entrypoint: recorder.py
      files:
      - recorder.py
      runner: py-genlayer:5jycge4q8k23462jtb0b9fyey1s9qz928sz2nbrd9mg4sxqg2qng
    constructor_args:
    - type:
        type: address
      value:
        contract_ref: oracle
    - type:
        type: address
      value:
        contract_ref: audit
    - type:
        type: string
        max_length: 128
      value:
        literal: market-001
    - type:
        type: string
        enum:
        - decided
        - finalized
      value:
        from_context: emission_stage
  audit:
    source_project:
      entrypoint: audit.py
      files:
      - audit.py
      runner: py-genlayer:5jycge4q8k23462jtb0b9fyey1s9qz928sz2nbrd9mg4sxqg2qng
    constructor_args:
    - type:
        type: string
        max_length: 128
      value:
        literal: market-001
    - type:
        type: boolean
      value:
        literal: false
operations:
  read_oracle:
    contract: oracle
    method: get_state
    readonly: true
    result:
      type: object
      fields:
        market_id:
          type: string
          max_length: 128
        outcome:
          type: string
          enum:
          - unresolved
          - 'yes'
          - 'no'
          - void
        confidence_bps:
          type: integer
          minimum: 0
          maximum: 10000
        revision:
          type: integer
          minimum: 0
        evidence_hash:
          type: string
          max_length: 64
  resolve:
    contract: oracle
    method: resolve
    readonly: false
    arguments:
    - name: evidence
      type:
        type: string
        max_length: 16000
    result:
      type: object
      fields:
        market_id:
          type: string
          max_length: 128
        outcome:
          type: string
          enum:
          - unresolved
          - 'yes'
          - 'no'
          - void
        confidence_bps:
          type: integer
          minimum: 0
          maximum: 10000
        revision:
          type: integer
          minimum: 0
        evidence_hash:
          type: string
          max_length: 64
  read_record:
    contract: recorder
    method: get_state
    readonly: true
    result:
      type: object
      fields:
        market_id:
          type: string
          max_length: 128
        recorded:
          type: boolean
        outcome:
          type: string
          enum:
          - unresolved
          - 'yes'
          - 'no'
          - void
        oracle_revision:
          type: integer
          minimum: 0
        record_count:
          type: integer
          minimum: 0
          maximum: 1
        audit_address:
          type: address
        emission_stage:
          type: string
          enum:
          - decided
          - finalized
  record:
    contract: recorder
    method: record
    readonly: false
    arguments:
    - name: expected_revision
      type:
        type: integer
        minimum: 1
    - name: outcome
      type:
        type: string
        enum:
        - 'yes'
        - 'no'
        - void
    result:
      type: object
      fields:
        market_id:
          type: string
          max_length: 128
        recorded:
          type: boolean
        outcome:
          type: string
          enum:
          - unresolved
          - 'yes'
          - 'no'
          - void
        oracle_revision:
          type: integer
          minimum: 0
        record_count:
          type: integer
          minimum: 0
          maximum: 1
        audit_address:
          type: address
        emission_stage:
          type: string
          enum:
          - decided
          - finalized
  read_audit:
    contract: audit
    method: get_state
    readonly: true
    arguments: []
    result:
      type: object
      fields:
        market_id:
          type: string
          max_length: 128
        authorized_emitter:
          type: address
        recorded:
          type: boolean
        outcome:
          type: string
          enum:
          - unresolved
          - 'yes'
          - 'no'
          - void
        oracle_revision:
          type: integer
          minimum: 0
        delivery_count:
          type: integer
          minimum: 0
          maximum: 1
        repair_count:
          type: integer
          minimum: 0
          maximum: 1
  authorize_audit:
    contract: audit
    method: authorize
    readonly: false
    arguments:
    - name: emitter
      type:
        type: address
    result:
      type: object
      fields:
        market_id:
          type: string
          max_length: 128
        authorized_emitter:
          type: address
        recorded:
          type: boolean
        outcome:
          type: string
          enum:
          - unresolved
          - 'yes'
          - 'no'
          - void
        oracle_revision:
          type: integer
          minimum: 0
        delivery_count:
          type: integer
          minimum: 0
          maximum: 1
        repair_count:
          type: integer
          minimum: 0
          maximum: 1
  repair_audit:
    contract: audit
    method: repair
    readonly: false
    arguments:
    - name: revision
      type:
        type: integer
        minimum: 1
    - name: outcome
      type:
        type: string
        enum:
        - 'yes'
        - 'no'
        - void
    result:
      type: object
      fields:
        market_id:
          type: string
          max_length: 128
        authorized_emitter:
          type: address
        recorded:
          type: boolean
        outcome:
          type: string
          enum:
          - unresolved
          - 'yes'
          - 'no'
          - void
        oracle_revision:
          type: integer
          minimum: 0
        delivery_count:
          type: integer
          minimum: 0
          maximum: 1
        repair_count:
          type: integer
          minimum: 0
          maximum: 1
state_reads:
  oracle_state: read_oracle
  record_state: read_record
  audit_state: read_audit
